    <script>
        function showLoader() {
            console.log("indise show loader")
            loader = document.getElementById('loader');

            loader.style.display = 'block';

        }
        var slider = $('#max_words')
        slider.on('change mousemove', function(evt) {
            $('#label_max_words').text('# words in summary: ' + slider.val())
            console.log("maxords")
        })
        var slider2 = $('#max_summaries')
        slider2.on('change mousemove', function(evt) {
            $('#Number_of_summaries').text('# of summaries: ' + slider2.val())
            console.log(slider2)
            if (slider2 == 3) {
                console.log("remove 4")
                $('.summ4').style.display = 'none';
                $('.summ4').hide();

            }

        })
        $('#Number_of_summaries').text('# of summaries: ' + slider2.val())





        function startDictation() {
            if (window.hasOwnProperty('webkitSpeechRecognition')) {
                var recognition = new webkitSpeechRecognition();

                recognition.continuous = false;
                recognition.interimResults = false;

                recognition.lang = 'en-US';
                recognition.start();

                recognition.onresult = function(e) {
                    document.getElementById('transcript').value = e.results[0][0].transcript;
                    recognition.stop();
                    document.getElementById('labnol').submit();
                };

                recognition.onerror = function(e) {
                    recognition.stop();
                };
            }
        }
    </script>

<body>

    <div id="loader">
        <video autoplay muted src="../static/loader3.mp4"></video>
        <div id="loader2"></div>
    </div>

    <div class="main">
        <div class="  text-center ">
            <h1 class="display-2 mb-4 summbot ">SummBot </h1>
            <div class="tool">Text Summarization Tool</div>

            <form action="{{url_for('Url')}}" method="post">
                <div class="form__group field">
                    <!--new input bar bootstrap-->
                    <img onclick="startDictation()" src="../static/icons8-microphone-24.png" />
                    <span id='clickableAwesomeFont'><i class="fa fa-microphone" onclick="startDictation()"></i></span>

                    <div class="form_input_field">
                        <i class="fa fa-search"></i>
                        <div class="input_button">

                            <input type="input" class="form-control form-input  " placeholder="Enter your query..." name="data" id='name' required>

                            <button type="submit" name="Submit" onclick="showLoader()">Search</button>
                        </div>
                    </div>

                </div>


                <div class="parameters">
                    <div class="col-md-3 parameter1">
                        <label for="max_words" id="label_max_words"># words in summary: 50</label>
                        <input name="max_words" type="range" class="custom-range" min="50" max="200" value="50 " step="10 " id="max_words ">
                    </div>

                    <div class="col-md-3 parameter2">
                        <label for="max_summaries" id="Number_of_summaries"># of summaries: 4</label>
                        <input name="max_summaries" type="range" class="custom-range" min="1 " max="4 " value="4 " step="1 " id="max_summaries ">
                    </div>
                </div>

            </form>

        </div>




    </div>

    <div class="text_style ">

        <p>--You can also get summary by--</p>

    </div>

    <div class="summ_container ">


        <!--FILE UPLOAD SUMMARY-->

            <div class="col-md-1 col-sm-6 counter-item trigger_popup_fricc1">

                                    <input class="btn btn-primary" type="submit" value="Submit" name="submit" />

                                </form>

                            </div>

                        </div>
                    </div>

                </div>



                <h4>Upload File</h4>
            </div>

        </div>

        <!--URL UPLOAD SUMMARY-->

            <div class="col-md-1 col-sm-6 counter-item trigger_popup_fricc2">

                <span class="number" data-from="0" data-to="34" data-refresh-interval="100"></span>
                <span class="lnr lnr-link"></span>
                <div class="hover_bkgr_fricc2">
                    <span class="helper"></span>
                    <div class="popup_content2">
                        <div class="popupCloseButton2">&times;</div>
                        <div class="row">
                            <div class="col-29">
                                <label for="formurl" id="form-label">Give the URL of article</label>

                                <form action="{{url_for( 'uploadUrl')}}" id="form_url" name="urlinfo" method="POST" enctype="multipart/form-data">

        <div class="boxed-page overlay bg-fixed">
