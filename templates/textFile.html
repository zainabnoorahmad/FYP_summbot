<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link
      rel="stylesheet"
      href="../static/vendor/bootstrap/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../static/vendor/select2/select2.min.css" />
    <link
      rel="stylesheet"
      href="../static/vendor/owlcarousel/owl.carousel.min.css"
    />
    <link rel="stylesheet" href="../static/vendor/lightcase/lightcase.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400|Work+Sans:300,400,700"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../static/style.min.css" />
    <link
      rel="stylesheet"
      href="https://cdn.linearicons.com/free/1.0.0/icon-font.min.css"
    />
    <link
      href="https://file.myfontastic.com/7vRKgqrN3iFEnLHuqYhYuL/icons.css"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/modernizr/2.8.3/modernizr.js"></script>
    <link rel="stylesheet" href="../static/style.css" />

    <script
      type="text/javascript "
      src="http://ajax.googleapis.com/ajax/libs/jquery/1/jquery.js "
    ></script>
    <script src="../static/vendor/bootstrap/popper.min.js "></script>
    <script src="../static/vendor/bootstrap/bootstrap.min.js "></script>
    <script src="../static/vendor/select2/select2.min.js "></script>
    <script src="../static/vendor/owlcarousel/owl.carousel.min.js "></script>
    <script src="../static/vendor/isotope/isotope.min.js "></script>
    <script src="../static/vendor/lightcase/lightcase.js "></script>
    <script src="../static/vendor/waypoints/waypoint.min.js "></script>
    <script src="../static/vendor/countTo/jquery.countTo.js "></script>

    <!-- Main JS -->
    <script src="../static/js/app.min.js "></script>
    <script src="//localhost:35729/livereload.js "></script>
  </head>

  <body
    data-spy="scroll"
    data-target="#navbar-nav-header"
    class="static-layout"
  >
    <div class="boxed-page">
      <nav id="gtco-header-navbar" class="navbar navbar-expand-lg py-4">
        <div class="container">
          <span>LOGO</span>
        </div>
      </nav>

      <!-- Input Section -->
      <div class="jumbotron d-flex align-items-center">
        <div class="container text-center">
          <h1 class="display-2 mb-4">SUMMBOT</h1>
          <div class="tool">Text Summarization Tool</div>
          <br />
          <br />
          <div class="mb-3">
            <label for="formFile" class="form-label">Upload a text file</label>

            <form
              action="http://localhost:5000/getFile"
              method="POST"
              enctype="multipart/form-data"
            >
              <input
                class="form-control"
                type="file"
                name="textFile"
                id="formFile"
              />
              <input class="btn btn-primary" type="submit" value="Submit" />
            </form>
          </div>

          <div class="input-group">
            <textarea class="form-control" aria-label="With textarea" rows="15">
{{text}}</textarea
            >
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
